name: Publiceer app-update

# Hoe het werkt (in gewone taal):
#
#  1. Je pusht naar main (of start hem hier met de hand, keuze "test").
#     De code wordt eerst gecontroleerd op tikfouten. Zit er een fout in, dan
#     stopt het hier en krijgt niemand iets.
#  2. Daarna wordt de nieuwe versie klaargezet als TESTVERSIE. Alleen de
#     testers (zie TESTERS hieronder: Bram en Patrick) krijgen hem op hun
#     telefoon. Iedereen anders houdt de versie die hij had.
#  3. Werkt het bij de testers? Ga naar GitHub → Actions → "Publiceer
#     app-update" → "Run workflow", kies "iedereen" en klik op de groene knop.
#     Dan krijgt iedereen precies die geteste versie (er wordt niets opnieuw
#     gebouwd).
#  Noodknop: kies "direct" om te bouwen en meteen naar iedereen te sturen
#  (zoals het vroeger altijd ging). Alleen gebruiken als het echt moet.
#
# Telefoons installeren alleen een HOGERE versie dan ze hebben.

on:
  push:
    branches: [main]
    paths:
      - 'www/**'
      - 'web/**'
      - '.github/workflows/release.yml'
      - '.github/scripts/**'
  workflow_dispatch:
    inputs:
      actie:
        description: 'Wat wil je doen?'
        type: choice
        default: test
        options:
          - test       # nieuwe versie bouwen, alleen naar de testers
          - iedereen   # de huidige testversie naar iedereen sturen
          - direct     # bouwen en meteen naar iedereen (noodknop)

permissions:
  contents: read
  pages: write
  id-token: write

# Niet halverwege afbreken: anders kan "naar iedereen" een lopende
# publicatie onderbreken. Ze wachten netjes op elkaar.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  SITE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
  # Gebruikers-id's (uit de tabel gebruikers) die een nieuwe versie eerst
  # krijgen. Komma's ertussen, geen spaties. Nu: Bram, Patrick.
  TESTERS: adb8bd40-f0b6-4aa2-a16d-a67932202c02,02486cab-37ac-45e3-ad11-2e9d5eb1b6cb
  ACTIE: ${{ github.event_name == 'push' && 'test' || inputs.actie }}

jobs:
  publiceren:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Code ophalen
        uses: actions/checkout@v4

      - name: Controle op fouten in de code
        if: env.ACTIE != 'iedereen'
        run: |
          set -e
          node .github/scripts/syntaxcheck.js www/*.html $(ls web/*.html 2>/dev/null || true)

      - name: Huidige online versie ophalen
        run: |
          set -e
          mkdir -p oud site/bundels
          # De versie die nu online staat (met ?t= om de cache te omzeilen).
          if ! curl -fsSL "$SITE/version.json?t=$(date +%s)" -o oud/version.json; then
            if [ "$ACTIE" = "direct" ]; then
              echo '{}' > oud/version.json
              echo "Geen online versie gevonden; 'direct' gaat door."
            else
              echo "FOUT: de huidige version.json kon niet opgehaald worden."
              echo "Probeer het over een paar minuten opnieuw."
              exit 1
            fi
          fi
          cat oud/version.json

          # Bundels die moeten blijven bestaan opnieuw meenemen (de site wordt
          # bij elke publicatie helemaal vervangen). Controle met de checksum.
          haal() {  # $1 = versie, $2 = url, $3 = checksum
            [ -z "$1" ] && return 0
            [ -f "site/bundels/$1.zip" ] && return 0
            curl -fsSL "$2" -o "site/bundels/$1.zip"
            echo "$3  site/bundels/$1.zip" | sha256sum -c -
          }
          V=$(jq -r '.version // empty' oud/version.json)
          if [ -n "$V" ]; then haal "$V" "$(jq -r .url oud/version.json)" "$(jq -r .checksum oud/version.json)"; fi
          TV=$(jq -r '.test.version // empty' oud/version.json)
          if [ -n "$TV" ] && [ "$ACTIE" = "iedereen" ]; then
            haal "$TV" "$(jq -r .test.url oud/version.json)" "$(jq -r .test.checksum oud/version.json)"
          fi

      - name: Versienummer bepalen
        id: versie
        run: echo "nummer=1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Bundel bouwen
        if: env.ACTIE != 'iedereen'
        run: |
          set -e
          mkdir -p bundel
          cp -R www/. bundel/

          # Versienummer in de bundel zetten
          sed -i "s|const APP_VERSION = '0.0.0-dev';|const APP_VERSION = '${{ steps.versie.outputs.nummer }}';|" bundel/index.html

          if ! grep -q "const APP_VERSION = '${{ steps.versie.outputs.nummer }}';" bundel/index.html; then
            echo "FOUT: het versienummer kon niet in index.html gezet worden."
            echo "Waarschijnlijk is de regel 'const APP_VERSION' aangepast of verwijderd."
            exit 1
          fi
          # Nog een keer controleren, nu precies wat er naar de telefoons gaat.
          node .github/scripts/syntaxcheck.js bundel/index.html

          # Rommel die niet mee hoeft
          find bundel -name '.DS_Store' -delete

          (cd bundel && zip -qr "../site/bundels/${{ steps.versie.outputs.nummer }}.zip" .)
          echo "Bundel gebouwd: $(du -h site/bundels/${{ steps.versie.outputs.nummer }}.zip | cut -f1)"

      - name: version.json schrijven
        run: |
          set -e
          NIEUW="${{ steps.versie.outputs.nummer }}"
          MIN=""
          # Optioneel: minimaal bouwnummer van de app uit de winkel. Zet een
          # getal in .github/min-native-build.txt als een update een nieuwe
          # app-versie nodig heeft (bv. een nieuwe plugin).
          if [ -f .github/min-native-build.txt ]; then MIN=$(tr -dc '0-9' < .github/min-native-build.txt); fi
          testers=$(jq -cn --arg t "$TESTERS" '$t | split(",") | map(select(length>0))')
          deel() {  # $1 = versie → {"version","url","checksum"}
            jq -cn --arg v "$1" --arg u "$SITE/bundels/$1.zip" \
                   --arg c "$(sha256sum "site/bundels/$1.zip" | cut -d' ' -f1)" --arg m "$MIN" \
              '{version:$v,url:$u,checksum:$c} + (if $m=="" then {} else {min_native:($m|tonumber)} end)'
          }
          OUD=$(jq -r '.version // empty' oud/version.json)
          OUDTEST=$(jq -r '.test.version // empty' oud/version.json)

          case "$ACTIE" in
            test)
              [ -n "$OUD" ] || { echo "FOUT: er staat nog geen versie voor iedereen online. Kies 'direct'."; exit 1; }
              STABIEL=$(jq -c '{version,url,checksum} + (if .min_native then {min_native} else {} end)' oud/version.json)
              # De oude gewone versie stond misschien nog als dist.zip; nu onder bundels/.
              STABIEL=$(echo "$STABIEL" | jq -c --arg u "$SITE/bundels/$OUD.zip" '.url=$u')
              TEST=$(deel "$NIEUW")
              ;;
            iedereen)
              [ -n "$OUDTEST" ] || { echo "FOUT: er staat geen testversie klaar."; exit 1; }
              STABIEL=$(jq -c --arg u "$SITE/bundels/$OUDTEST.zip" '.test | {version,url,checksum} + (if .min_native then {min_native} else {} end) | .url=$u' oud/version.json)
              TEST=null
              NIEUW="$OUDTEST"
              ;;
            direct)
              STABIEL=$(deel "$NIEUW")
              TEST=null
              ;;
            *) echo "Onbekende actie: $ACTIE"; exit 1;;
          esac

          jq -n --argjson s "$STABIEL" --argjson t "$TEST" --argjson testers "$testers" \
                --arg tijd "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg commit "${{ github.sha }}" --arg actie "$ACTIE" \
            '$s + {gepubliceerd:$tijd, commit:$commit, actie:$actie, testers:$testers}
                + (if $t == null then {} else {test:$t} end)' > site/version.json
          cat site/version.json

          # Alleen bundels bewaren waar version.json naar wijst.
          for f in site/bundels/*.zip; do
            v=$(basename "$f" .zip)
            if ! jq -e --arg v "$v" '.version==$v or .test.version==$v' site/version.json >/dev/null; then rm -f "$f"; fi
          done

          # Oude telefoons kijken soms nog naar dist.zip: dat is de gewone versie.
          GEWOON=$(jq -r .version site/version.json)
          cp "site/bundels/$GEWOON.zip" site/dist.zip

          # Webversie: app.html = gewone versie, app-test.html = testversie.
          unzip -p "site/bundels/$GEWOON.zip" index.html > site/app.html
          TESTV=$(jq -r '.test.version // empty' site/version.json)
          if [ -n "$TESTV" ]; then unzip -p "site/bundels/$TESTV.zip" index.html > site/app-test.html; fi

      - name: Simpele statuspagina
        run: |
          GEWOON=$(jq -r .version site/version.json)
          TESTV=$(jq -r '.test.version // "geen"' site/version.json)
          cat > site/index.html <<EOF
          <!DOCTYPE html><html lang="nl"><head><meta charset="utf-8">
          <title>TC Group Planning — updates</title>
          <style>body{font-family:system-ui,sans-serif;max-width:520px;margin:4rem auto;padding:0 1.5rem;color:#1A1917}
          a{color:#1A1917}code{background:#F7F6F2;padding:2px 6px;border-radius:4px}</style></head>
          <body><h1>TC Group Planning</h1>
          <p>Deze pagina host de live-updates van de app.</p>
          <p>Voor iedereen: <code>$GEWOON</code> &middot; testversie: <code>$TESTV</code></p>
          <p><a href="app.html"><strong>Open de webversie van de app</strong></a></p>
          <ul><li><a href="version.json">version.json</a> — welke versie nu actueel is</li>
          <li><a href="dist.zip">dist.zip</a> — de bundel voor iedereen</li></ul>
          </body></html>
          EOF

      - name: Losse pagina's meenemen
        run: |
          if [ -d web ]; then cp -R web/. site/; fi

      - name: Pages voorbereiden
        uses: actions/configure-pages@v5

      - name: Bestanden uploaden
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publiceren
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Klaar
        run: |
          GEWOON=$(jq -r .version site/version.json)
          TESTV=$(jq -r '.test.version // empty' site/version.json)
          if [ "$ACTIE" = "test" ]; then
            echo "Testversie $TESTV staat online, alleen voor de testers."
            echo "Werkt hij goed? Actions → Publiceer app-update → Run workflow → kies 'iedereen'."
          else
            echo "Versie $GEWOON staat online voor iedereen."
          fi
          echo "De app pikt hem op bij de eerstvolgende keer openen."
